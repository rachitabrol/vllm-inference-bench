name: benchmark

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Experiments to run: 'all' or comma list, e.g. 01,02 or 04 (= 04a-04d)"
        type: string
        default: all
      gpu:
        description: GPU type
        type: choice
        options: [L4, A100-40GB, A10G, H100]
        default: L4
      smoke:
        description: "Smoke test: 0.5B model, 20 prompts, concurrency 1+4, experiments 01+02 only (cents)"
        type: boolean
        default: true

permissions:
  contents: write

# never run two paid benchmarks at once
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      EXPERIMENTS: ${{ inputs.experiments }}
      GPU: ${{ inputs.gpu }}
      SMOKE: ${{ inputs.smoke }}
    steps:
      - name: Fail loudly if Modal secrets are missing
        run: |
          missing=0
          for v in MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (Settings -> Secrets and variables -> Actions)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run benchmarks on Modal
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}-${GPU}"
          if [ "$SMOKE" = "true" ]; then RUN_ID="${RUN_ID}-smoke"; SMOKE_FLAG="--smoke"; else SMOKE_FLAG="--no-smoke"; fi
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          modal run benchmark/modal_app.py --experiments "$EXPERIMENTS" --gpu "$GPU" $SMOKE_FLAG --run-id "$RUN_ID"

      - name: Analyze
        run: python analysis/analyze.py "results/raw/${RUN_ID}"

      - name: Job summary
        run: |
          cat results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          for f in "results/raw/${RUN_ID}"/help_serve.txt "results/raw/${RUN_ID}"/help_bench.txt; do
            if [ -f "$f" ]; then
              { echo; echo "<details><summary>$(basename "$f") (head)</summary>"; echo; echo '```'; head -n 80 "$f"; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            results/
            plots/

      - name: Commit results
        if: ${{ !inputs.smoke }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results plots
          git commit -m "results: ${RUN_ID}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
